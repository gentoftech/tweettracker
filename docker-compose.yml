services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tweettracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tweettracker}
      POSTGRES_DB: ${POSTGRES_DB:-tweettracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tweettracker} -d ${POSTGRES_DB:-tweettracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn tweettracker.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tweettracker}:${POSTGRES_PASSWORD:-tweettracker}@db:5432/${POSTGRES_DB:-tweettracker}
      - AUTO_MIGRATE=true
      - SEED_FIXTURES=${SEED_FIXTURES:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - TWEETTRACKER_VAULT_FILE=/app/data/.vault.key
      - TWEETTRACKER_SECRET_KEY
      - TWEETAPI_API_KEY
      - GOOGLE_AI_API_KEY
      - XAI_API_KEY
      - GITHUB_TOKEN
      - TWEETTRACKER_ADMIN_PASSWORD
      - TWEETTRACKER_WEBHOOK_SECRET
    volumes:
      - appdata:/app/data

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python -m tweettracker.worker.main
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tweettracker}:${POSTGRES_PASSWORD:-tweettracker}@db:5432/${POSTGRES_DB:-tweettracker}
      - AUTO_MIGRATE=true
      - SEED_FIXTURES=${SEED_FIXTURES:-false}
      - TWEETTRACKER_VAULT_FILE=/app/data/.vault.key
      - TWEETTRACKER_SECRET_KEY
      - TWEETAPI_API_KEY
      - GOOGLE_AI_API_KEY
      - XAI_API_KEY
      - GITHUB_TOKEN
      - TWEETTRACKER_ADMIN_PASSWORD
      - TWEETTRACKER_WEBHOOK_SECRET
    volumes:
      - appdata:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - INTERNAL_API_URL=http://api:8000

volumes:
  pgdata:
  appdata:
